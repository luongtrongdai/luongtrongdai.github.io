<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA redirect (supports project pages and user pages).
      const pathSegmentsToKeep = window.location.hostname.endsWith('github.io') ? 1 : 0;
      const { pathname, search, hash, protocol, host } = window.location;
      const redirectPath = pathname
        .split('/')
        .slice(0, 1 + pathSegmentsToKeep)
        .join('/');
      if (search.startsWith('?/')) {
        const normalizedTarget = `${protocol}//${host}${redirectPath}/${search}${hash}`;
        window.location.replace(normalizedTarget);
      } else {
        const routePath = pathname
          .slice(1)
          .split('/')
          .slice(pathSegmentsToKeep)
          .join('/');
        const query = search ? `&${search.slice(1).replace(/&/g, '~and~')}` : '';
        const target = `${protocol}//${host}${redirectPath}/?/${routePath}${query}${hash}`;
        window.location.replace(target);
      }
    </script>
  </head>
  <body></body>
</html>
