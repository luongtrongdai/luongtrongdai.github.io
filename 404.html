<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting...</title>
    <script>
      // Safe fallback for GitHub Pages: always go back to app base path.
      var l = window.location;
      var pathSegmentsToKeep = l.hostname.endsWith('github.io') ? 1 : 0;
      var basePath = '/' + l.pathname.split('/').filter(Boolean).slice(0, pathSegmentsToKeep).join('/');
      l.replace(basePath + '/');
    </script>
  </head>
  <body></body>
</html>
